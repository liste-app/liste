# Capture parser fixtures. Unless a case says otherwise: now is Wednesday
# 2026-03-04 10:00 in Europe/Istanbul, the locale is US (month/day, 12-hour
# clock), and the existing lists are "Work", "Home Improvement", "Errands".
# A missing key means "absent". Keys: input, title, date, time, tags,
# priority, list, list_kind (explicit|existing), rule, locale (us|eu|iso),
# now (YYYY-MM-DDTHH:MM), tz.

# --- the canonical line, in every order ---------------------------------
