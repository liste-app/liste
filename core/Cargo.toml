[package]
name = "liste-core"
description = "Liste core: data model, SQLite, sync, encryption, search, parsing, recurrence, undo, importers, host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
liste-ipc.workspace = true
rusqlite.workspace = true
chacha20poly1305.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
hkdf.workspace = true
sha2.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# On the web the core runs in a dedicated worker and stores the database in
# OPFS through the sahpool VFS only (Section 10). Browsers without OPFS are
# unsupported for persistence; no IndexedDB VFS is used or reintroduced.
# rusqlite 0.39 pulls in sqlite-wasm-rs 0.5; the matching VFS crate is
# sqlite-wasm-vfs 0.2. Only its sahpool VFS is registered.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
sqlite-wasm-vfs = "0.2"
