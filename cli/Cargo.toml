[package]
name = "liste-cli"
description = "The `liste` command-line tool (IPC client) and `liste daemon` (headless host)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "liste"
path = "src/main.rs"

[dependencies]
liste-ipc.workspace = true
# The core is linked only for `liste daemon`, which is a host, not a client.
liste-core.workspace = true
clap.workspace = true
ctrlc.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[bench]]
name = "roundtrip"
harness = false
