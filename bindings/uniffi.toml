# UniFFI configuration for the Liste core bindings (Section 14).

[bindings.swift]
module_name = "ListeCore"
ffi_module_name = "ListeCoreFFI"
generate_immutable_records = true

[bindings.kotlin]
package_name = "app.liste.core"
cdylib_name = "liste_bindings"
generate_immutable_records = true

# C# bindings are generated by uniffi-bindgen-cs (NordSecurity), which reads
# this same file. The Windows app is Phase 2.
[bindings.csharp]
namespace = "Liste.Core"
cdylib_name = "liste_bindings"
