[workspace]
resolver = "3"
members = [
    "core",
    "ipc",
    "bindings",
    "server",
    "cli",
    "mcp",
]
# apps/linux joins the workspace when Phase 3 starts (docs/ARCHITECTURE.md, Section 2).

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/liste-app/liste"
publish = false

[workspace.dependencies]
# Workspace crates
liste-core = { path = "core" }
liste-ipc = { path = "ipc" }

# Storage (Section 10). `bundled` compiles SQLite with FTS5 on native targets;
# on wasm32-unknown-unknown rusqlite switches to sqlite-wasm-rs automatically.
# Held at 0.39 (libsqlite3-sys 0.37) because the released sqlx 0.9.0 caps
# libsqlite3-sys below 0.38 and Cargo resolves the `links = "sqlite3"` package
# once per workspace even when sqlx's sqlite driver is not enabled. Move to
# 0.40 when a sqlx release allows libsqlite3-sys 0.38.
rusqlite = { version = "0.39.0", features = ["bundled"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
] }

# Cryptography (Section 7). Audited RustCrypto and dalek crates only, pinned
# exactly; a bump is a deliberate, reviewed change.
chacha20poly1305 = "=0.11.0"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
hkdf = "=0.13.0"
sha2 = "=0.11.0"
zeroize = { version = "=1.9.0", features = ["derive"] }
subtle = "=2.6.1"
getrandom = "=0.4.3"

# Bindings (Section 14). Held at the 0.31 line so that uniffi-bindgen-cs
# (currently v0.11.0+v0.31.0) stays in lockstep for the Windows app.
uniffi = "0.31.2"
wasm-bindgen = "0.2.129"

# Server (Section 12)
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

# Calendar math and time zones (Sections 5 and 15). Pinned exactly; the
# bundled tz database keeps every device on identical rules.
jiff = { version = "=0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always", "serde"] }

# Local IPC transport (Section 3): Unix domain sockets and Windows named
# pipes behind one interface.
interprocess = "=2.4.4"
ctrlc = { version = "=3.5.2", features = ["termination"] }

# Local MCP server (Section 13): the official Rust SDK, stdio transport only.
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }

# Shared
uuid = { version = "1.26.1", features = ["v7", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
