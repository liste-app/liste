# Rust workspace: core, ipc, bindings, server, cli, mcp.
#
# Runs on every pull request so its checks can be required on main, and
# filters by path inside the workflow: when nothing Rust-related changed the
# jobs are skipped, which GitHub treats as passing. The core suite in
# core/tests/ therefore runs on every change to the core, the IPC crate, or
# the bindings (Section 15 and Section 16 of docs/ARCHITECTURE.md). The
# benches run in release mode against the 50,000-task fixture and fail on
# a threshold regression.

name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "Cargo.toml"
              - "Cargo.lock"
              - "core/**"
              - "ipc/**"
              - "bindings/**"
              - "server/**"
              - "cli/**"
              - "mcp/**"
              - ".github/workflows/rust.yml"

  check:
    name: Format and lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast

  bench:
    name: Bench
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p liste-core --bench insert
      - run: cargo bench -p liste-core --bench search
