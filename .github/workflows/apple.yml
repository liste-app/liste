# iOS and macOS apps (Phase 1). Runs when the Apple app, the core, the IPC
# crate, or the bindings change: builds the XCFramework, runs the ListeKit
# tests and the acceptance driver, and builds the macOS app.

name: Apple

on:
  push:
    branches: [main]
    paths:
      - "apps/apple/**"
      - "core/**"
      - "ipc/**"
      - "bindings/**"
      - ".github/workflows/apple.yml"
  pull_request:
    paths:
      - "apps/apple/**"
      - "core/**"
      - "ipc/**"
      - "bindings/**"
      - ".github/workflows/apple.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the XCFramework and Swift bindings
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          bindings/build-apple.sh
      - name: ListeKit tests and the acceptance driver
        run: |
          cargo build -p liste-cli
          cd apps/apple/ListeKit && swift test
      - name: Build the macOS app
        run: |
          cd apps/apple && xcodebuild -project Liste.xcodeproj -scheme Liste \
            -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO | tail -5
